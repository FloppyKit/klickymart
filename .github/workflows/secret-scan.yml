name: secret-scan

# Repo-wide, every push and PR, no paths filter: a crawler-only or root-only commit is scanned too.
on:
  push:
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Value scan of every git-tracked file from the repo root. Prints file:line:rule only, never the value.
      # Rules + tests: site/scripts/secret-scan.py, crawler/tests/test_secret_scan.py. `secret-scan: allow` hits are
      # printed as ALLOWED and may not exceed .secret-scan-allow-baseline.
      - name: Secret scan (tracked files)
        run: python3 site/scripts/secret-scan.py
      # Blocking gitleaks over the full git history (default rules + .gitleaks.toml; reviewed false positives in
      # .gitleaksignore). Output redacted.
      - name: gitleaks (git history, blocking)
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" | tar xz -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact=100 -v
