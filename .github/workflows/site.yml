name: site

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: node scripts/embed-fixtures.js
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench
      - run: npx playwright install chromium
      - run: |
          npx wrangler dev --local --port 8787 &
          echo $! > /tmp/wrangler.pid
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/stats >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: npm run e2e
      - run: kill "$(cat /tmp/wrangler.pid)" 2>/dev/null || true
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source site --no-git -v || git grep -nE "(api[_-]?token|account_id|secret)" site/ | grep -v REPLACE_AT_DEPLOY | (! grep .)
