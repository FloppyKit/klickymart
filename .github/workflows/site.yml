name: site

# One run per push: push covers PR heads too, so no pull_request trigger (it double-ran).
on:
  push:
    paths:
      - "site/**"
      - "data/**"
      - "crawler/check_append_only.py"
      - ".github/workflows/site.yml"
  # pull_request only drives the ledgers job (PR base sha); the site job stays push-only (one run per push).
  pull_request:
    paths:
      - "data/hand-*.jsonl"
      - "crawler/check_append_only.py"
      - ".github/workflows/site.yml"

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledgers:
    # data/hand-*.jsonl are append-only (Satoshi 2026-10-31). r6-2: own concurrency group, never cancelled, and a stable
    # base so a cancelled/skipped run can't hide a rewrite:
    #   pull_request -> the PR base sha
    #   push, non-main -> merge base with origin/main (stable across pushes)
    #   push, main -> github.event.before (an unreachable old tip after a force-push fails closed) AND every ancestor
    #                 commit that touched the ledgers (each must be a line prefix of today's files)
    # Advisory until Matt marks "ledgers" a required check and disables force-push on main (branch protection).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ledgers-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append-only ledgers vs stable base
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          if [ "$EVENT" = "pull_request" ]; then
            python3 crawler/check_append_only.py "$PR_BASE"
          elif [ "$REF" != "refs/heads/main" ]; then
            python3 crawler/check_append_only.py "$(git merge-base origin/main HEAD)"
          else
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              python3 crawler/check_append_only.py "$BEFORE"
            fi
            for c in $(git log --format=%H -- data/hand-first-seen.jsonl data/hand-anomalies.jsonl); do
              python3 crawler/check_append_only.py "$c"
            done
          fi
  site:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: node scripts/embed-fixtures.js
      - run: node scripts/copy-vendor.js
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench
      - run: npx playwright install chromium
      - run: |
          npx wrangler dev --local --port 8787 &
          echo $! > /tmp/wrangler.pid
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/stats >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: npm run e2e
      - run: kill "$(cat /tmp/wrangler.pid)" 2>/dev/null || true
      - name: Secret scan
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" | tar xz -C "$RUNNER_TEMP/gitleaks"
          if [ -x "$RUNNER_TEMP/gitleaks/gitleaks" ]; then
            "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --no-git -v --redact
          fi
          set -e
          git grep -nE "(api[_-]?token|account_id|secret)" -- . ':!node_modules' ':!worker/src/fixture-data.ts' | grep -v REPLACE_AT_DEPLOY | (! grep .)
