name: site

# One run per push: push covers PR heads too, so no pull_request trigger (it double-ran).
on:
  push:
    paths:
      - "site/**"
      - "data/**"
      - "crawler/check_append_only.py"
      - ".github/workflows/site.yml"
  # pull_request only drives the ledgers job (PR base sha); the site job stays push-only (one run per push).
  pull_request:
    paths:
      - "data/hand-*.jsonl"
      - "crawler/check_append_only.py"
      - ".github/workflows/site.yml"

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledgers:
    # data/hand-*.jsonl are append-only (Satoshi 2026-10-31). Base: push -> the previous tip (github.event.before; a
    # force-push that rewrote history makes it unreachable and the check fails closed); new branch (before = zeros) ->
    # merge base with origin/main; pull_request -> the PR base sha. Full history so the base resolves.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append-only ledgers vs base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then base="$(git merge-base origin/main HEAD)"
          else base="$BEFORE"; fi
          echo "append-only base: $base"
          python3 crawler/check_append_only.py "$base"
  site:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: node scripts/embed-fixtures.js
      - run: node scripts/copy-vendor.js
      - run: npm run typecheck
      - run: npm test
      - run: npm run bench
      - run: npx playwright install chromium
      - run: |
          npx wrangler dev --local --port 8787 &
          echo $! > /tmp/wrangler.pid
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/stats >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: npm run e2e
      - run: kill "$(cat /tmp/wrangler.pid)" 2>/dev/null || true
      - name: Secret scan
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" | tar xz -C "$RUNNER_TEMP/gitleaks"
          if [ -x "$RUNNER_TEMP/gitleaks/gitleaks" ]; then
            "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --no-git -v --redact
          fi
          set -e
          git grep -nE "(api[_-]?token|account_id|secret)" -- . ':!node_modules' ':!worker/src/fixture-data.ts' | grep -v REPLACE_AT_DEPLOY | (! grep .)
