name = "klickymart"
main = "worker/src/index.ts"
compatibility_date = "2026-08-22"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false

[[d1_databases]]
binding = "DB"
database_name = "klickymart"
database_id = "REPLACE_AT_DEPLOY"
migrations_dir = "worker/migrations"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_AT_DEPLOY"

[[durable_objects.bindings]]
name = "INGESTER"
class_name = "RelayIngester"

[[migrations]]
tag = "v1-ingester"
new_sqlite_classes = ["RelayIngester"]

# Relay catch-up (since = last seen per relay) and ingester keep-alive.
[triggers]
crons = ["*/5 * * * *"]

[vars]
SITE_ORIGIN = "https://klickymart.com"
SNAPSHOT_TTL_S = "60"
CONTACT = "bot@klickymart.com"
# Comma-separated or JSON array of wss:// URLs (placeholder until relay is live).
RELAY_URLS = "wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net"
# Set PREVIEW_DATA = "1" in a preview deployment to load synthetic *.example records only.
# PREVIEW_DATA = "0"

# Production: deploy with `wrangler deploy --env production` (custom domains; do not deploy from CI).
[env.production]
workers_dev = false

[[env.production.routes]]
pattern = "klickymart.com"
custom_domain = true

[[env.production.routes]]
pattern = "www.klickymart.com"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "klickymart"
database_id = "REPLACE_AT_DEPLOY"
migrations_dir = "worker/migrations"

[[env.production.kv_namespaces]]
binding = "KV"
id = "REPLACE_AT_DEPLOY"

[[env.production.durable_objects.bindings]]
name = "INGESTER"
class_name = "RelayIngester"

[[env.production.migrations]]
tag = "v1-ingester"
new_sqlite_classes = ["RelayIngester"]

[env.production.triggers]
crons = ["*/5 * * * *"]

[env.production.vars]
SITE_ORIGIN = "https://klickymart.com"
SNAPSHOT_TTL_S = "60"
CONTACT = "bot@klickymart.com"
RELAY_URLS = "wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net"
