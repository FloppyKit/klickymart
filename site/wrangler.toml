name = "klickymart"
main = "worker/src/index.ts"
compatibility_date = "2026-08-22"
workers_dev = true

# Build step: regenerate submit-blocklist.ts / probe-402.ts from crawler JSON (runs on wrangler deploy and dev).
[build]
command = "node scripts/gen-submit-data.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false

[[d1_databases]]
binding = "DB"
database_name = "klickymart"
database_id = "REPLACE_AT_DEPLOY"
migrations_dir = "worker/migrations"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_AT_DEPLOY"

[[durable_objects.bindings]]
name = "INGESTER"
class_name = "RelayIngester"

[[migrations]]
tag = "v1-ingester"
new_sqlite_classes = ["RelayIngester"]

# Relay catch-up (since = last seen per relay) and ingester keep-alive.
[triggers]
crons = ["15 6 * * *"]

[vars]
KM_ENDPOINT_BINDINGS = "off"  # M2: default OFF until Matt approves; code also defaults off when unset
KM_SIGNED_RESULTS = "off"  # M2: /open-store routes off by default
KM_KEY_LIFECYCLE = "off"  # M3: signing-key lifecycle off by default
KM_KEY_OTS = "off"  # M3: OpenTimestamps stamping of key records off by default
SITE_ORIGIN = "https://klickymart.com"
SNAPSHOT_TTL_S = "60"
CONTACT = "bot@klickymart.com"
# Comma-separated or JSON array of wss:// URLs (placeholder until relay is live).
RELAY_URLS = "wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net"
# Set PREVIEW_DATA = "1" in a preview deployment to load synthetic *.example records only.
# PREVIEW_DATA = "0"

# Production: deploy with `wrangler deploy --env production` (custom domains; do not deploy from CI).
[env.production]
workers_dev = false

[[env.production.routes]]
pattern = "klickymart.com"
custom_domain = true

[[env.production.routes]]
pattern = "www.klickymart.com"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "klickymart"
database_id = "REPLACE_AT_DEPLOY"
migrations_dir = "worker/migrations"

[[env.production.kv_namespaces]]
binding = "KV"
id = "REPLACE_AT_DEPLOY"

[[env.production.durable_objects.bindings]]
name = "INGESTER"
class_name = "RelayIngester"

[[env.production.migrations]]
tag = "v1-ingester"
new_sqlite_classes = ["RelayIngester"]

[env.production.triggers]
crons = ["15 6 * * *"]

[env.production.vars]
KM_ENDPOINT_BINDINGS = "off"  # M2: default OFF until Matt approves; code also defaults off when unset
KM_SIGNED_RESULTS = "off"  # M2: /open-store routes off by default
KM_KEY_LIFECYCLE = "off"  # M3: signing-key lifecycle off by default
KM_KEY_OTS = "off"  # M3: OpenTimestamps stamping of key records off by default
SITE_ORIGIN = "https://klickymart.com"
ENVIRONMENT = "production"  # R12-005: with this, a missing SUBMIT_SALT secret makes rate-limited endpoints return 503
# Value-for-value: footer tip slot + zap@klickymart.com forwarding (public addresses, not secrets; KlickyMart holds no funds).
SITE_TIP_LUD16 = "zap@klickymart.com"
LNURL_FORWARD_ZAP = "majorbadger18@primal.net"
SITE_ZAP_PUBKEY_HEX = "8a9cdf5624acbed82094d5954137d7febc8f1c41f9cad1ce665bdf40236fd8e4"  # KlickyMart Nostr account npub132wd743y4jldsgy56k25zd7hl67g78zpl89drnnxt005qgm0mrjqfz25ah (public). R9-001: zap requests to zap@ must p-tag this key; unset = zaps refused.
SNAPSHOT_TTL_S = "60"
CONTACT = "bot@klickymart.com"
RELAY_URLS = "wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net"
